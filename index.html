<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typing Speed Test by Kelvin</title>
    <style>
        html {
            background-color: #121212;
        }

        body {
            opacity: 0;
            visibility: hidden;
            transition: opacity 120ms ease;
        }

        body.ready {
            opacity: 1;
            visibility: visible;
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            window.addEventListener('load', () => {
                document.body.classList.add('ready');
            }, { once: true });

            setTimeout(() => {
                document.body.classList.add('ready');
            }, 50);
        });
    </script>
    <link rel="stylesheet" href="style-sheets/colors.css">
    <link rel="stylesheet" href="style-sheets/defaults.css">
    <link rel="stylesheet" href="style-sheets/structure.css">
    <link rel="stylesheet" href="style-sheets/responsive.css">
    <link rel="stylesheet" href="style-sheets/conditional-styles.css">
    <link rel="stylesheet" href="style-sheets/interactivity.css">
</head>
<body>

    <div class="toast">
    <svg class="toast-icon" viewBox="0 0 24 24" fill="none">
        <path 
            d="M12 9V13"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        />
        <path
            d="M12 17H12.01"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
        />
        <path
            d="M10.3 3.6L2.2 17.6C1.4 19 2.4 20.7 4 20.7H20C21.6 20.7 22.6 19 21.8 17.6L13.7 3.6C12.9 2.2 11.1 2.2 10.3 3.6Z"
            stroke="currentColor"
            stroke-width="2"
            stroke-linejoin="round"
        />
    </svg>

    <p>Settings unavailable during an active test</p>
</div>

    <header>
        <section class="logo-and-bestwpm">
            <div>
                <img class="mobile-logos logo-icon mobile-logo"  src="typing-speed-test-main/assets/images/logo-small.svg" >
                <img class="desktop-logos logo-icon desktop-logo"  src="typing-speed-test-main/assets/images/logo-large.svg">
            </div>

            <div>
                <svg id="wpm-trophy-icon" xmlns="http://www.w3.org/2000/svg" width="21" height="18" fill="none" viewBox="0 0 21 18"><path fill="#f4dc73" d="M19.406 2.25c.457 0 .844.387.844.844v1.969c0 1.265-.809 2.566-2.18 3.55-1.125.809-2.46 1.301-3.867 1.477-1.125 1.828-2.39 2.566-2.39 2.566v2.531H13.5c1.23 0 2.25.739 2.25 1.97v.421c0 .246-.21.422-.422.422H4.922a.406.406 0 0 1-.422-.422v-.422c0-1.23.984-1.968 2.25-1.968h1.688v-2.532s-1.301-.738-2.426-2.566c-1.407-.176-2.742-.668-3.867-1.477C.773 7.63 0 6.328 0 5.063v-1.97c0-.456.352-.843.844-.843H4.5V.844C4.5.387 4.852 0 5.344 0h9.562c.457 0 .844.387.844.844V2.25zM3.48 6.785c.422.317.915.563 1.477.774A12.7 12.7 0 0 1 4.5 4.5H2.25v.563c0 .421.352 1.125 1.23 1.722M18 5.062V4.5h-2.285a12.7 12.7 0 0 1-.457 3.059c.562-.211 1.055-.457 1.476-.774C17.367 6.363 18 5.66 18 5.062"/></svg>
                
                <span class="mobile-logos wpm-best-text" id="mobile-best">Best: <div class="bold"> <b class="best-wpm">0</b> WPM</div> </span>
                <span class="desktop-logos wpm-best-text" id="desktop-best">Personal best: <div class="bold"> <b class="best-wpm">0</b> WPM</div> </span>
            </div>

            <button class="restart-btn" id="index-restart-btn">
                <span class="restart-btn-text">Restart</span>
                <img class="restart-icon" src="typing-speed-test-main/assets/images/icon-restart.svg">
            </button>

            
        </section>



        <section class="header-2">

            <section class="wpm-accuracy-time">
                <div>
                    <span>WPM:</span>
                    <span class="current-wpm bold-and-big">0</span>
                </div>

                <div>
                    <span>Accuracy:</span>
                    <span class="accuracy bold-and-big red">100%</span>
                </div>

                <div>
                    <span>Time:</span>
                    <span class="time-taken bold-and-big yellow">0:00</span>
                </div>
            </section>


            <section class="diff-and-mode">

                <div class="mobile-diff-and-mode mobile-logos">
                    
                    <div class="mobile-diff-section">
                        <button class="dropdown-btn diff-dropdown-btn"> <span class="diff-text">Easy</span> <img class="dropdown-arrow diff-drop" src="typing-speed-test-main/assets/images/icon-down-arrow.svg"> </button>
                        
                        <div class="dropdown-options diff-dropdown-options no-display" id="mobile-diff-dropdown">
                            <label class="easy-diff"><input type="radio" name="difficulty" checked> Easy</label>
                            <label class="medium-diff"><input type="radio" name="difficulty"> Medium</label>
                            <label class="hard-diff"><input type="radio" name="difficulty"> Hard</label>
                        </div>
                    
                    </div>

                    <div class="mobile-timemode-section">
                        <button class="dropdown-btn timemode-dropdown-btn"> <span class="mode-btn-text">Passage</span> <img class="dropdown-arrow mode-arrow" src="typing-speed-test-main/assets/images/icon-down-arrow.svg"> </button>
                        
                        <div class="dropdown-options timemode-dropdown-options no-display" id="timemode-dropdown">
                            <label class="passage"><input type="radio" name="mode" checked> Passage</label>
                            <label class="timed"><input type="radio" name="mode"> Timed(60s)</label>
                        </div>

                    </div>
                </div>

                <div class="desktop-diff-and-mode desktop-logos">

                    <div class="desktop-diff-section desk-settings-section">
                        Difficulty:
                        <span class="desk-btn-parent">
                            <button class="easy-diff desk-easy desk-btn desk-diff-btn selected">Easy</button>
                            <button class="medium-diff desk-medium desk-diff-btn desk-btn">Medium</button>
                            <button class="hard-diff desk-hard desk-diff-btn desk-btn">Hard</button>
                        </span>
                    </div>

                    <div class="desktop-timemode-section desk-settings-section">
                        Mode:
                        <span class="desk-btn-parent">
                            <button class="passage desk-passage desk-mode-btn desk-btn selected">Passage</button>
                            <button class="timed desk-timed desk-mode-btn desk-btn">Timed(60s)</button>
                        </span>
                    </div>
                </div>
                
            </section>
        </section>

       
    </header>


    <main>

        <section class="typing-text-container">

            <div class="start-test">
                <button class="start-test-btn">Start Typing Test</button>
                <span>Or click the text and start typing</span>
            </div>

            <input
                id="hiddenInput"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                inputmode="text"
            />

            <div class="display-text-area">
                
            </div>
        </section>

        
        <!--<button class="restart-btn">
            Restart Test
            <img src="typing-speed-test-main/assets/images/icon-restart.svg">
        </button>-->
        
    </main>


<script type="module" src="scripts/app.js"></script> 
</body>
</html>
